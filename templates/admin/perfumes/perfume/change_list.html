{% extends "admin/change_list.html" %}

{% block content %}
<div style="margin-bottom: 20px; padding: 10px; background: #f8f9fa; border: 1px solid #dee2e6;">
  <form method="get">
    {% for key, value in price_filter_parameters %}
    <input type="hidden" name="{{ key }}" value="{{ value }}">
    {% endfor %}
    <label>Min Price: <input type="number" step="0.01" name="price_min" value="{{ price_min }}" /></label>
    <label>Max Price: <input type="number" step="0.01" name="price_max" value="{{ price_max }}" /></label>
    <button type="submit">Filter</button>
    <a href=".">Clear</a>
  </form>
</div>

{{ block.super }}
{% endblock %}
